name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare release asset
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "ElinkMemo-${VERSION}-debug.apk"
          echo "ASSET=ElinkMemo-${VERSION}-debug.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "ElinkMemo ${GITHUB_REF_NAME}" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" --title "ElinkMemo ${GITHUB_REF_NAME}" --generate-notes
          fi
